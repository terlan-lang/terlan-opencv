[[behaviors]]
id = "calib3d.current_geometry"
module = "calib3d"
title = "Current camera geometry"
status = "implemented"
domain = "Owned matrices and copied camera, distortion, transform, and pose values admitted by the current package."
ownership = "Inputs are borrowed for one call; matrices and copied result records are independently owned."
errors = "Invalid geometry, shape, and native failures become stable package errors."
operation_prefixes = ["opencv.calib3d."]
upstream_sections = ["OpenCV calib3d camera calibration and 3D reconstruction"]
evidence = ["tests/opencv/Calib3dTest.terl", "samples/calib3d/PoseEstimation.terl"]

[[behaviors]]
id = "calib3d.remaining"
module = "calib3d"
title = "Remaining calibration behavior"
status = "incomplete"
fallback = true
domain = "Pinned calib3d public behavior not yet admitted by a narrower behavior."
ownership = "Future APIs must return owned matrices or named copied results."
errors = "Unsupported domains remain unavailable until assigned stable package errors."
upstream_sections = ["OpenCV calib3d public headers"]
evidence = ["bindings/opencv.api-inventory.json"]

[[behaviors]]
id = "core.matrix_values"
module = "core"
title = "Owned matrix values"
status = "implemented"
domain = "Two-dimensional owned matrices across the package scalar depths and supported channel counts."
ownership = "Matrices use generation-checked unique owners; copied views and byte projections never escape borrowed storage."
errors = "Shape, layout, range, stale-handle, and allocation failures are stable package errors."
operation_prefixes = ["opencv.mat."]
upstream_sections = ["OpenCV core basic structures and Mat"]
evidence = ["tests/opencv/MatTest.terl", "tests/opencv/MatViewTest.terl", "samples/core/MatBasics.terl"]

[[behaviors]]
id = "core.linear_algebra"
module = "core"
title = "Dense linear algebra and random values"
status = "implemented"
domain = "Owned typed matrices, deterministic floating-point random matrices, finite reductions, and dense F32/F64 linear systems."
ownership = "Every matrix result is a fresh owner; scalar and trace results are copied finite values."
errors = "Invalid dimensions, scalar depths, decomposition policies, singular systems, non-finite results, and native failures use stable package errors."
operations = [
  "opencv.core.determinant",
  "opencv.core.dot",
  "opencv.core.identity",
  "opencv.core.inverse",
  "opencv.core.multiply",
  "opencv.core.norm",
  "opencv.core.ones",
  "opencv.core.random_uniform",
  "opencv.core.solve",
  "opencv.core.trace",
]
upstream_sections = ["OpenCV core array operations and linear algebra"]
evidence = ["tests/opencv/CoreTest.terl", "tools/native_direct_check/tests/core_linear_algebra.rs"]

[[behaviors]]
id = "core.dense_array_algorithms"
