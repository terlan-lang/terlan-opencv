rationale = "Generation-tagged resource disposal rejects stale use and releases the unique native owner exactly once."

[[rejections]]
family = "cpp.pointer.unsupported"
rationale = "Raw pointers require a reviewed copied-buffer or owned-resource adapter."

[[rejections]]
family = "cpp.lifetime.borrowed"
rationale = "Borrowed results and views cannot escape one generated native call."

[[rejections]]
family = "cpp.template.unspecialized"
rationale = "Dependent templates require a package-selected concrete adapter."

[[rejections]]
family = "cpp.exception.crossing"
rationale = "Throwing calls require contained exception or stable failure translation."

[[rejections]]
family = "cpp.overload.ambiguous"
rationale = "Overload selection requires one stable symbol identity."

[[rejections]]
family = "cpp.callback.unsupported"
rationale = "Callback ownership, lifetime, and reentrancy are not inferred."

[[rejections]]
family = "cpp.variadic.unsupported"
rationale = "Variadic C++ calls have no generated typed signature."

[[rejections]]
family = "cpp.inheritance.unsupported"
rationale = "Unreviewed inheritance layout and virtual dispatch do not cross the boundary."

[[rejections]]
family = "cpp.ownership.unknown"
rationale = "Every resource producer must declare an ownership transfer."

[[rejections]]
family = "cpp.type.unmapped"
rationale = "Every admitted C++ type requires one reviewed Terlan representation."
