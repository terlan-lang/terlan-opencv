schema = "terlan.opencv.cpp-binding-shapes.v1"
upstream_commit = "fe38fc608f6acb8b68953438a62305d8318f4fcd"
compiler_gate = "make cpp-binding-generator-check"

[[shapes]]
id = "external_dynamic_linkage"
operations = ["opencv.codecs.decode"]
evidence = ["tests/cpp/opencv_link_probe.cc", "tests/opencv/CodecsTest.terl"]
rationale = "The generated package links the pinned external OpenCV module closure and executes it from Terlan."

[[shapes]]
id = "opaque_unique_resource"
operations = ["opencv.mat.from_u8"]
evidence = ["tools/native_direct_check/tests/native_adapter.rs", "tests/opencv/MatTest.terl"]
rationale = "Matrix construction transfers one unique C++ owner into a typed Terlan native handle."

[[shapes]]
id = "multiple_resource_types"
