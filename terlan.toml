[package]
name = "terlan-opencv"
version = "0.1.0-dev"
namespace = "opencv"
description = "CPU-first OpenCV vision, machine-learning, and inference-preprocessing integration for Terlan"
license = "Apache-2.0"
repository = "https://github.com/terlan-lang/terlan-opencv"
compiler = ">= 0.0.7"
links = ["https://terlan.org", "https://opencv.org"]

[build]
source_roots = ["src"]
artifact = "library"

[scripts]
check-cpp-validation = "scripts/CheckCppValidation.terls"
check-sources = "scripts/CheckSources.terls"
fresh-workspace-check = "scripts/FreshWorkspaceCheck.terls"
generate-package = "scripts/GeneratePackage.terls"
package-artifact = "scripts/PackageArtifact.terls"
runtime-checks = "scripts/RuntimeChecks.terls"
workspace = "scripts/Workspace.terls"
